<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Toldos | Lonas Toba</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    background:#061c3f;
    font-family:Arial, Helvetica, sans-serif;
    color:white;
}

.galeria{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:40px 0;
}

.volver{
    display:inline-block;
    margin-bottom:25px;
    padding:12px 25px;
    background:#d92f20;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}

.volver:hover{
    background:#b72216;
}

h1{
    font-size:50px;
    margin-bottom:10px;
}

.descripcion{
    font-size:20px;
    color:#ddd;
    margin-bottom:40px;
}

.principal img{
    width:100%;
    height:550px;
    object-fit:cover;
    border-radius:20px;
}

.fotos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:30px;
}

.fotos img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:15px;
    cursor:pointer;
    transition:.3s;
}

.fotos img:hover{
    transform:scale(1.04);
}

.visor{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.9);

    display:none;

    justify-content:center;

    align-items:center;

    z-index:9999;

    cursor:pointer;

}

.visor img{

    max-width:90%;

    max-height:90%;

    border-radius:20px;

    box-shadow:0 0 40px rgba(0,0,0,.6);

}

</style>

</head>

<div id="visor" class="visor">

    <span class="cerrar" onclick="cerrarVisor()">&times;</span>

    <button class="flecha izquierda" onclick="anterior()">&#10094;</button>

    <img id="imagenGrande">

    <button class="flecha derecha" onclick="siguiente()">&#10095;</button>

</div>

<script>
const imagenes = document.querySelectorAll(".fotos img");

const visor = document.getElementById("visor");
const imagenGrande = document.getElementById("imagenGrande");

let actual = 0;

imagenes.forEach((img, indice) => {
    img.addEventListener("click", () => {
        actual = indice;
        mostrar();
        visor.style.display = "flex";
    });
});

function mostrar() {
    imagenGrande.src = imagenes[actual].src;
}

function cerrarVisor() {
    visor.style.display = "none";
}

function siguiente() {
    actual++;
    if (actual >= imagenes.length) actual = 0;
    mostrar();
}

function anterior() {
    actual--;
    if (actual < 0) actual = imagenes.length - 1;
    mostrar();
}
</script>

<body>

<div class="galeria">

<a href="confeccion.html" class="volver">← Volver</a>

<h1>Toldos</h1>

<p class="descripcion">
Diseños resistentes y personalizados para hogares, comercios e industrias.
</p>

<div class="principal">

<img src="img/toldos/toldo1.jpeg">

</div>

<div class="fotos">

<img src="img/toldos/toldo1.jpeg">

<img src="img/toldos/toldo2.jpeg">

<img src="img/toldos/toldo3.jpeg">

<img src="img/toldos/toldo4.jpeg">

<img src="img/toldos/toldo5.jpeg">

<img src="img/toldos/toldo6.jpeg">

</div>

</div>

</body>

</html>
